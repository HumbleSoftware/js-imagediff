<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>imagediff reporter fixture</title>
  <!-- A page whose specs fail on purpose, for spec/browser/reporter.spec.js.
       Open http://localhost:8085/spec/reporter/ to see the report. -->
  <base href="../../">
  <link rel="stylesheet" href="node_modules/jasmine-core/lib/jasmine-core/jasmine.css">
  <script src="node_modules/jasmine-core/lib/jasmine-core/jasmine.js"></script>
  <script src="node_modules/jasmine-core/lib/jasmine-core/jasmine-html.js"></script>
  <script src="node_modules/jasmine-core/lib/jasmine-core/boot.js"></script>
  <script>
    jasmine.getEnv().configure({ random: false });

    // Collect results for spec/browser/reporter.spec.js.
    window.specResults = { specs: [], done: null };
    jasmine.getEnv().addReporter({
      specDone: function (result) { window.specResults.specs.push(result); },
      jasmineDone: function (result) { window.specResults.done = result; }
    });
  </script>
  <script>
    // ?lib= loads a built file instead of the source (see IMAGEDIFF_LIBRARY).
    var lib = /[?&]lib=([^&]*)/.exec(window.location.search);
    document.write('<script src="' + (lib ? decodeURIComponent(lib[1]) : 'js/imagediff.js') + '"><\/script>');
  </script>
  <script src="spec/reporter/FailingSpec.js"></script>
</head>
<body>
</body>
</html>
