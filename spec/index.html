<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>imagediff specs</title>
  <!-- Specs load fixtures relative to the repository root (spec/images/...). -->
  <base href="../">
  <link rel="stylesheet" href="node_modules/jasmine-core/lib/jasmine-core/jasmine.css">
  <script src="node_modules/jasmine-core/lib/jasmine-core/jasmine.js"></script>
  <script src="node_modules/jasmine-core/lib/jasmine-core/jasmine-html.js"></script>
  <script src="node_modules/jasmine-core/lib/jasmine-core/boot.js"></script>
  <script>
    // Run specs in declaration order unless ?random= is given.
    if (!/[?&]random=/.test(window.location.search)) {
      jasmine.getEnv().configure({ random: false });
    }

    // Collect results for spec/browser/jasmine.spec.js.
    window.specResults = { specs: [], suites: [], done: null };
    jasmine.getEnv().addReporter({
      specDone: function (result) { window.specResults.specs.push(result); },
      suiteDone: function (result) { window.specResults.suites.push(result); },
      jasmineDone: function (result) { window.specResults.done = result; }
    });
  </script>
  <script src="js/imagediff.js"></script>
  <script src="spec/ImageDiffSpec.js"></script>
</head>
<body>
</body>
</html>
